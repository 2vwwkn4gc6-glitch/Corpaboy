<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Котик Ульяна</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap">
<style>
:root{--bg1:#ffe3ee;--bg2:#ffc2da;--card:#fff7fa;--ink:#6b2346;--soft:#b5587f;--btn:#ff7fb0;--btn2:#ff5c9a;--line:#f7b4cf;--bar:#ffe0ec;--glow:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1428;--bg2:#561f3b;--card:#4a1a33;--ink:#ffe3ee;--soft:#ffb3d1;--btn:#e0558b;--btn2:#c93d77;--line:#7c3057;--bar:#66294a;--glow:#6a2848}}
:root[data-theme="dark"]{--bg1:#3a1428;--bg2:#561f3b;--card:#4a1a33;--ink:#ffe3ee;--soft:#ffb3d1;--btn:#e0558b;--btn2:#c93d77;--line:#7c3057;--bar:#66294a;--glow:#6a2848}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,var(--bg2) 0,transparent 45%),radial-gradient(circle at 85% 90%,var(--bg2) 0,transparent 40%),var(--bg1);background-color:var(--bg1);display:flex;justify-content:center;padding:18px 14px 32px;overflow-x:hidden}
main{position:relative;z-index:1;width:100%;max-width:500px;text-align:center}
.bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgfx span{position:absolute;bottom:-50px;opacity:0;animation:rise linear infinite}
#dim{position:fixed;inset:0;background:#0c0828;opacity:0;transition:opacity .6s;pointer-events:none;z-index:0}
body.dark #dim{opacity:.9}
body.dark .sub,body.dark .foot,body.dark .tag{color:#ffd3e6}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.tag{font-size:14px;font-weight:500;color:var(--soft)}
.top div{display:flex;gap:8px}
h1{font-family:'Pacifico','Brush Script MT',cursive;font-weight:400;font-size:clamp(40px,12vw,56px);margin:4px 0 0;line-height:1.1;background:linear-gradient(90deg,#ff7fb0,#e0407f);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.08em .15em;display:inline-block;filter:drop-shadow(0 4px 8px rgba(255,92,154,.25))}
.sub{margin:2px 0 14px;color:var(--soft);font-size:16px}
.stage{position:relative;background:radial-gradient(ellipse at 50% 78%,var(--glow) 0,var(--card) 64%);border:2px solid var(--line);border-radius:36px;padding:60px 10px 8px;box-shadow:0 24px 50px -12px rgba(255,92,154,.35),inset 0 0 0 6px rgba(255,255,255,.3);overflow:hidden;animation:enter .9s cubic-bezier(.2,1.2,.3,1)}
.lights{position:absolute;inset:-60%;opacity:0;transition:opacity .4s;pointer-events:none;z-index:1;background:conic-gradient(from 0deg at 50% 50%,rgba(255,92,154,.4),rgba(255,226,110,.35),rgba(110,220,255,.35),rgba(180,120,255,.4),rgba(255,92,154,.4));animation:spinL 3s linear infinite}
.stage.disco .lights{opacity:1}
.night{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .5s;font-size:34px;text-align:right;padding:14px 20px;background:radial-gradient(circle at 18% 22%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 64% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 36% 40%,#fff 0 1px,transparent 2px),radial-gradient(circle at 88% 36%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 10% 62%,#fff 0 1px,transparent 2px),radial-gradient(circle at 78% 70%,#fff 0 1px,transparent 2px),rgba(12,8,38,.74)}
.night.on{opacity:1}
.bubble{position:absolute;z-index:6;top:14px;left:50%;transform:translateX(-50%);max-width:90%;background:#fff;color:#6b2346;border:2px solid var(--line);border-radius:20px;padding:7px 16px;font-size:17px;font-weight:500;white-space:nowrap}
.bubble.pop{animation:pop .35s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
svg.cat{position:relative;z-index:2;width:100%;max-width:340px;height:auto;display:block;margin:0 auto;cursor:pointer;touch-action:manipulation;overflow:visible}
.cat *{transform-box:fill-box}
.hand{position:absolute;z-index:5;font-size:46px;opacity:0;pointer-events:none;transition:opacity .2s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.hand.show{opacity:1}
.hand.stroke{animation:hStroke .7s ease-in-out 3}
.hand.scr{animation:hScr .14s linear 14}
.ball{position:absolute;z-index:3;bottom:16px;left:calc(50% - 16px);font-size:32px;opacity:0;pointer-events:none}
.ball i{display:inline-block;font-style:normal;animation:ballY .4s ease-out infinite alternate}
.ball.go{animation:ballX 3.3s ease-in-out}
.fx{position:absolute;z-index:5;font-size:30px;pointer-events:none;animation:floatUp 1.5s ease-out forwards}
.fx.drop{animation:fall .8s ease-in forwards}
.fx.kiss{font-size:34px;animation:kissFly 1.5s ease-out forwards}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 14px}
.m{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 12px;text-align:left;font-size:14px}
.bar{height:12px;background:var(--bar);border-radius:99px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ec6,var(--btn2));border-radius:99px;transition:width .5s}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.btns button{font-size:16px;font-weight:600;color:var(--btn2);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:15px 8px;box-shadow:0 6px 14px -4px rgba(255,92,154,.35);transition:transform .15s,box-shadow .15s}
.btns button:hover{transform:translateY(-3px);box-shadow:0 12px 20px -6px rgba(255,92,154,.45)}
.btns button:active{transform:scale(.96)}
.btns button[data-a="pet"],.btns button[data-a="kiss"]{background:linear-gradient(180deg,var(--btn),var(--btn2));color:#fff;border-color:transparent}
.btns .wide{grid-column:1/-1;background:var(--bar)}
.chip{font-size:13px;font-weight:500;padding:8px 12px;border-radius:99px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 2px 8px rgba(255,92,154,.15)}
.chip[aria-pressed="true"]{background:var(--btn2);color:#fff;border-color:var(--btn2)}
button:focus-visible,svg.cat:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.foot{margin-top:16px;color:var(--soft);font-size:14px}

/* --- лицо --- */
.eh,.es,.ek,.ba,.mOpen,.mKiss,.mFrown,.mSick,#sweat,#puke{display:none}
.cat[data-mood="happy"] .eo,.cat[data-mood="sleep"] .eo,.cat[data-mood="sick"] .eo,.cat[data-mood="kiss"] .eo{display:none}
.cat[data-mood="happy"] .eh,.cat[data-mood="kiss"] .eh{display:block}
.cat[data-mood="sleep"] .es{display:block}
.cat[data-mood="sick"] .ek{display:block}
.cat[data-mood="angry"] .ba{display:block}
.cat[data-mood="kiss"] #mouth,.cat[data-mood="angry"] #mouth,.cat[data-mood="sick"] #mouth,.cat[data-mouth="open"] #mouth{display:none}
.cat[data-mood="kiss"] .mKiss{display:block}
.cat[data-mood="angry"] .mFrown{display:block}
.cat[data-mood="sick"] .mSick{display:block}
.cat[data-mouth="open"] .mOpen{display:block}
.cat[data-mouth="open"] .mSick,.cat[data-mouth="open"] .mKiss,.cat[data-mouth="open"] .mFrown{display:none}
.cat .blink{animation:blink 4.5s infinite;transform-origin:50% 50%}
.cat[data-mood="happy"] .cheek,.cat[data-mood="kiss"] .cheek{opacity:.95}
#tintG,#tintR{opacity:0;transition:opacity .6s}
.cat.sweaty #sweat{display:block;animation:drip 1.2s ease-in infinite}
#puke circle{opacity:0;transform-origin:50% 50%}
.cat.vomit #puke{display:block}
.cat.vomit #puke circle{animation:spew .9s ease-out forwards}
#puddle{opacity:0}
.cat.vomit #puddle{animation:puddle 4s .6s forwards}
#zzz{opacity:0;transition:opacity .4s}
.cat[data-mood="sleep"] #zzz{opacity:1}
.z{fill:var(--soft);font:600 26px Fredoka,sans-serif;animation:zz 2.4s ease-in-out infinite}
.z2{animation-delay:.5s;font-size:20px}.z3{animation-delay:1s;font-size:15px}

/* --- каркас кота --- */
#rig{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
#tail{transform-origin:10% 90%;animation:wag 2.6s ease-in-out infinite}
#head{transform-origin:50% 90%;animation:tilt 7s ease-in-out infinite}
#armL,#armR{transform-origin:50% 8%;transition:transform .3s}
#footL,#footR{transform-origin:50% 100%}
#torso{transform-origin:50% 100%;transition:transform .6s}
.ear{transform-origin:50% 100%}.ear.tw{animation:twitch .4s}
#eyes{transition:transform .15s}
.cat[data-mood="happy"] #tail{animation-duration:.8s}
.cat.fat1 #torso{transform:scale(1.07,1.03)}
.cat.fat2 #torso{transform:scale(1.16,1.08)}
.cat.fat3 #torso{transform:scale(1.28,1.14)}

/* --- действия --- */
.cat.petting #head{animation:pHead .7s ease-in-out 3}
.cat.scratching #head{animation:sHead 2s ease-in-out}
.cat.scratching #footR{animation:kick .14s linear 14}
.cat.kiss #head{animation:kHead 1.8s ease-in-out}
.cat.kiss #armR{animation:kArm 1.8s ease-in-out}
.cat.paw #armR{animation:pawArm 2.2s ease-in-out}
.cat.paw #head{animation:tiltPaw 2.2s ease-in-out}
.cat.chew #head{animation:chewHead .25s 6}
.cat.chew .mOpen{animation:chewMouth .25s 6}
.cat.play{animation:pj 3.3s ease-in-out}
.cat.play #armL{animation:swatL .5s 7}
.cat.play #armR{animation:swatR .5s .25s 6}
.cat.play #head{animation:playHead 3.3s ease-in-out}
.cat.play #eyes{animation:eyeTrack 3.3s ease-in-out}
.cat.hug{animation:hugCat 2.5s ease-in-out;transform-origin:50% 100%}
.cat.hug #armL{animation:hugL 2.5s ease-in-out}
.cat.hug #armR{animation:hugR 2.5s ease-in-out}
.cat.hug #head{animation:hugHead 2.5s ease-in-out}
.cat.twirl{animation:twirl .85s ease-in-out}
.cat.dance{animation:sway 1.36s ease-in-out infinite}
.cat.dance #rig{animation:dRig 1.36s ease-in-out infinite}
.cat.dance #armL{animation:dArmL 1.36s ease-in-out infinite}
.cat.dance #armR{animation:dArmR 1.36s ease-in-out infinite}
.cat.dance #footL{animation:dFootL 1.36s ease-in-out infinite}
.cat.dance #footR{animation:dFootR 1.36s ease-in-out infinite}
.cat.dance #head{animation:dHead 1.36s ease-in-out infinite}
.cat.dance #tail{animation:wag .5s ease-in-out infinite}
.cat.yawn #head{animation:yawnHead 1.8s ease-in-out}
.cat.yawn #armL{animation:stretchL 1.8s ease-in-out}
.cat.yawn #armR{animation:stretchR 1.8s ease-in-out}
.cat.wash #armR{animation:washArm 2.3s ease-in-out}
.cat.wash #head{animation:washHead 2.3s ease-in-out}
.cat.look #eyes{animation:lookAround 2.4s ease-in-out}
.cat.angry{animation:shake .1s linear infinite}
.cat.angry #head{animation:aHead .3s ease-in-out infinite}
.cat.angry #footL{animation:stomp .3s ease-in infinite}
.cat.angry #footR{animation:stomp .3s ease-in .15s infinite}
.cat.angry #armL{animation:fistL .3s ease-in-out infinite}
.cat.angry #armR{animation:fistR .3s ease-in-out infinite}
.cat.angry #tail{animation:wag .22s ease-in-out infinite}
.cat.retch #rig{animation:retch .22s ease-in-out infinite}
.cat.retch #head{animation:retchHead .22s ease-in-out infinite}
.cat.sleeping #head{animation:none;transform:translate(0,30px) rotate(-7deg);transition:transform .8s}
.cat.sleeping #armL{transform:rotate(-12deg)}
.cat.sleeping #armR{transform:rotate(12deg)}
.cat.sleeping #tail{animation:none;transform:rotate(-20deg)}
.cat.sleeping #rig{animation-duration:5s}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,1.03)}}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes tilt{0%,45%,100%{transform:rotate(0)}55%,75%{transform:rotate(-4deg)}85%{transform:rotate(3deg)}}
@keyframes twitch{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pop{0%{transform:translateX(-50%) scale(.85)}60%{transform:translateX(-50%) scale(1.07)}100%{transform:translateX(-50%) scale(1)}}
@keyframes enter{0%{opacity:0;transform:translateY(28px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.55}90%{opacity:.4}100%{transform:translateY(-115vh) rotate(40deg);opacity:0}}
@keyframes floatUp{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-170px) scale(1.4)}}
@keyframes fall{0%{opacity:0;transform:translateY(-120px) rotate(-30deg)}30%{opacity:1}85%{opacity:1;transform:translateY(0) rotate(10deg)}100%{opacity:0;transform:translateY(6px) scale(.2)}}
@keyframes kissFly{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(0,-190px) scale(2.6) rotate(-12deg)}}
@keyframes spinL{to{transform:rotate(360deg)}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-8px);opacity:1}}
@keyframes hStroke{0%,100%{transform:translateX(-46px) rotate(-14deg)}50%{transform:translateX(46px) rotate(14deg)}}
@keyframes hScr{0%,100%{transform:translate(-8px,0) rotate(-6deg)}50%{transform:translate(8px,4px) rotate(6deg)}}
@keyframes ballX{0%{opacity:1;transform:translateX(-150px)}50%{opacity:1;transform:translateX(150px)}100%{opacity:1;transform:translateX(-150px)}}
@keyframes ballY{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-46px) rotate(180deg)}}
@keyframes pHead{0%,100%{transform:translate(-5px,7px) rotate(-4deg)}50%{transform:translate(5px,7px) rotate(4deg)}}
@keyframes sHead{0%,100%{transform:none}12%,88%{transform:rotate(8deg) translateY(-6px)}}
@keyframes kick{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg) translateY(-7px)}}
@keyframes kHead{0%,100%{transform:none}25%,65%{transform:scale(1.07) translateY(-6px)}}
@keyframes kArm{0%,100%{transform:none}22%,50%{transform:rotate(-165deg)}65%{transform:rotate(-120deg)}}
@keyframes pawArm{0%,100%{transform:rotate(0)}15%{transform:rotate(-78deg)}25%,45%,65%{transform:rotate(-70deg)}35%,55%,75%{transform:rotate(-88deg)}90%{transform:rotate(-78deg)}}
@keyframes tiltPaw{0%,100%{transform:none}15%,85%{transform:rotate(-5deg) translateX(-4px)}}
@keyframes chewHead{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.97)}}
@keyframes chewMouth{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@keyframes swatL{0%,100%{transform:rotate(0)}40%{transform:rotate(95deg)}}
@keyframes swatR{0%,100%{transform:rotate(0)}40%{transform:rotate(-95deg)}}
@keyframes pj{0%,100%{transform:translate(-20px,0)}25%{transform:translate(0,-24px)}50%{transform:translate(20px,0)}75%{transform:translate(0,-24px)}}
@keyframes playHead{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes eyeTrack{0%,100%{transform:translate(-7px,3px)}50%{transform:translate(7px,3px)}}
@keyframes hugCat{0%,100%{transform:scale(1)}25%,75%{transform:scale(1.07) translateY(-6px)}}
@keyframes hugL{0%,100%{transform:rotate(0)}22%,78%{transform:rotate(-64deg)}}
@keyframes hugR{0%,100%{transform:rotate(0)}22%,78%{transform:rotate(64deg)}}
@keyframes hugHead{0%,100%{transform:none}25%,75%{transform:rotate(-7deg) translate(-6px,4px)}}
@keyframes twirl{0%{transform:scaleX(1)}50%{transform:scaleX(-1) translateY(-14px)}100%{transform:scaleX(1)}}
@keyframes sway{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
@keyframes dRig{0%,100%{transform:translateY(0) rotate(-3deg)}25%{transform:translateY(-16px)}50%{transform:translateY(0) rotate(3deg)}75%{transform:translateY(-16px)}}
@keyframes dArmL{0%,100%{transform:rotate(125deg)}50%{transform:rotate(25deg)}}
@keyframes dArmR{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(-125deg)}}
@keyframes dFootL{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-16px) rotate(-10deg)}}
@keyframes dFootR{0%,50%,100%{transform:translateY(0)}75%{transform:translateY(-16px) rotate(10deg)}}
@keyframes dHead{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translateY(-6px)}}
@keyframes yawnHead{0%,100%{transform:none}25%,75%{transform:rotate(-7deg) translateY(-5px) scale(1.03)}}
@keyframes stretchL{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(165deg)}}
@keyframes stretchR{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-165deg)}}
@keyframes washArm{0%,100%{transform:none}18%,80%{transform:rotate(-150deg)}30%,54%{transform:rotate(-142deg)}42%,66%{transform:rotate(-156deg)}}
@keyframes washHead{0%,100%{transform:none}18%,80%{transform:rotate(5deg) translateY(4px)}}
@keyframes lookAround{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,1px)}60%{transform:translate(8px,-2px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-.6deg)}75%{transform:translateX(3px) rotate(.6deg)}}
@keyframes aHead{0%,100%{transform:scale(1.02) translateY(2px)}50%{transform:scale(1.05) translateY(-2px) rotate(2deg)}}
@keyframes stomp{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fistL{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-8deg)}}
@keyframes fistR{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(8deg)}}
@keyframes retch{0%,100%{transform:scale(1.04,1)}50%{transform:scale(.97,1.05) translateY(4px)}}
@keyframes retchHead{0%,100%{transform:none}50%{transform:translate(0,16px) rotate(8deg)}}
@keyframes spew{0%{opacity:1;transform:translate(0,0) scale(.3)}100%{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}}
@keyframes puddle{0%{opacity:0;transform:scale(.1,.3)}12%{opacity:.95;transform:scale(1)}80%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.cat,.cat *,.bgfx span,.lights,.stage,.hand,.ball,.ball i{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<div id="dim" aria-hidden="true"></div>
<main>
  <div class="top"><span class="tag">Ульяна и её уголок</span><div><button class="chip" id="musicBtn" aria-pressed="false">🎵 Музыка: выкл</button><button class="chip" id="sfxBtn" aria-pressed="true">🔊 Звуки</button></div></div>
  <h1>Ульяна</h1>
  <p class="sub">самый милый котик на свете</p>

  <section class="stage" id="stage">
    <div class="lights" aria-hidden="true"></div>
    <div class="night" id="night" aria-hidden="true">🌙</div>
    <div class="bubble" id="bubble">Мяу! Привет!</div>
    <svg class="cat" id="cat" data-mood="normal" data-mouth="smile" viewBox="0 0 300 300" role="img" aria-label="Котик Ульяна" tabindex="0">
      <ellipse cx="150" cy="294" rx="100" ry="8" fill="rgba(160,30,90,.18)"/>
      <ellipse id="puddle" cx="150" cy="292" rx="70" ry="9" fill="#9fcf55"/>
      <g id="tail"><path d="M212 258 C268 262 282 214 262 182 C256 172 244 178 250 190 C262 212 252 240 210 240Z" fill="#fff" stroke="#f3a6c0" stroke-width="3"/><path d="M262 182 C256 172 244 178 250 190 C254 197 258 196 262 190Z" fill="#ffb3d1"/></g>
      <g id="rig">
        <g id="footL"><ellipse cx="90" cy="288" rx="24" ry="12" fill="#fff" stroke="#f3a6c0" stroke-width="3"/><circle cx="80" cy="290" r="3" fill="#ffb3d1"/><circle cx="90" cy="292" r="3" fill="#ffb3d1"/><circle cx="100" cy="290" r="3" fill="#ffb3d1"/></g>
        <g id="footR"><ellipse cx="210" cy="288" rx="24" ry="12" fill="#fff" stroke="#f3a6c0" stroke-width="3"/><circle cx="200" cy="290" r="3" fill="#ffb3d1"/><circle cx="210" cy="292" r="3" fill="#ffb3d1"/><circle cx="220" cy="290" r="3" fill="#ffb3d1"/></g>
        <g id="torso"><ellipse cx="150" cy="232" rx="72" ry="58" fill="#fff" stroke="#f3a6c0" stroke-width="3"/><ellipse cx="150" cy="240" rx="40" ry="36" fill="#ffeaf3"/></g>
        <g id="armL"><ellipse cx="106" cy="244" rx="16" ry="44" fill="#fff" stroke="#f3a6c0" stroke-width="3"/><ellipse cx="106" cy="278" rx="8" ry="6" fill="#ffb3d1"/></g>

  /* ---- звук и музыка (синтез в браузере) ---- */
  var AC=null,master=null,NB=null,sfxOn=true,musicOn=false,mTimer=null,mNext=0,mStep=0,mTouched=false;

  document.addEventListener('visibilitychange',function(){
    if(!AC)return;
    if(document.hidden)AC.suspend();else{AC.resume();mNext=AC.currentTime+.1}
  });

  /* ---- оживление котика ---- */
  document.addEventListener('pointermove',function(e){
    if(asleep||busy)return;
    var r=cat.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/r.width,dy=(e.clientY-(r.top+r.height*.4))/r.height;
    eyes.style.transform='translate('+Math.max(-1,Math.min(1,dx*2))*6+'px,'+Math.max(-1,Math.min(1,dy*2))*5+'px)';
  });
  function twitch(){
    var e=Math.random()<.5?earL:earR;e.classList.add('tw');setTimeout(function(){e.classList.remove('tw')},400);
    setTimeout(twitch,3000+Math.random()*4000);
  }
  setTimeout(twitch,2500);
  function idle(){
    var acting=ACTS.some(function(c){return cat.classList.contains(c)});
    if(!asleep&&!busy&&!acting){
      var k=['yawn','wash','look'][Math.floor(Math.random()*3)];
      if(k==='yawn'){mood('sleep');mouth('open',1700);act('yawn',1800);setTimeout(function(){if(!asleep&&!busy)mood('normal')},1800)}
      else act(k,2400);
    }
    setTimeout(idle,7000+Math.random()*6000);
  }
  setTimeout(idle,6000);
  var bg=$('bgfx'),em=['💗','🌸','✨','💕','🩷'];
  for(var n=0;n<14;n++){
    var s=document.createElement('span');s.textContent=em[n%em.length];s.style.left=(Math.random()*100)+'%';
    s.style.fontSize=(14+Math.random()*18)+'px';s.style.animationDuration=(12+Math.random()*14)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';bg.appendChild(s);
  }
  setInterval(function(){
    if(food>0){
      food=Math.max(0,food-3);bars();
      if(food<100&&stuff&&!busy){stuff=0;fat(0)}
      if(food<=15&&!asleep&&!busy)talk(pick('hungry'));
    }
  },9000);
  bars();
})();
</script>
</body>
</html>
